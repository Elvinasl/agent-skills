server:
    port: 8080
    shutdown: graceful

spring:
    application:
        name: __APP_NAME__
    threads:
        virtual:
            enabled: true
    flyway:
        enabled: true
        baseline-on-migrate: true
        out-of-order: true
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
    jackson:
        time-zone: UTC
    data:
        web:
            pageable:
                default-page-size: 20
                max-page-size: 100
                serialization-mode: via-dto
    messages:
        basename: i18n/messages
        encoding: UTF-8
        fallback-to-system-locale: false
    # >>>mod:rabbit
    rabbitmq:
        listener:
            simple:
                prefetch: 1
                retry:
                    enabled: true
                    max-retries: 5
                    initial-interval: 2s
                    multiplier: 3
                    max-interval: 3m
    # <<<mod:rabbit

app:
    cors:
        allowed-origins: http://localhost:3000
    supported-locales: en
# >>>mod:jobrunr

jobrunr:
    background-job-server:
        enabled: true
        worker-count: 5
        thread-type: VirtualThreads
    dashboard:
        enabled: true
        port: 9091
# <<<mod:jobrunr

logging:
    level:
        root: INFO
        __PACKAGE__: DEBUG
        org.hibernate: WARN
